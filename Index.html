<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mess Ledger</title>
<meta name="description" content="Mess management system">
<meta name="theme-color" content="#1F6B4F" id="metaTheme">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='104' fill='%231F6B4F'/%3E%3Ccircle cx='256' cy='292' r='118' fill='none' stroke='%23F6F2E7' stroke-width='30'/%3E%3Ccircle cx='256' cy='292' r='62' fill='%23F6F2E7'/%3E%3Cg stroke='%23F6F2E7' stroke-width='22' stroke-linecap='round' fill='none'%3E%3Cpath d='M186 118c0-26 26-26 26-52'/%3E%3Cpath d='M256 104c0-26 26-26 26-52'/%3E%3Cpath d='M326 118c0-26 26-26 26-52'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F4F1E9;--panel:#FDFCF8;--panel2:#F6F3EA;--ink:#20281F;--ink2:#5C6657;--mut:#8B937F;--line:#E2DCCB;--line2:#EDE8DA;
--acc:#1F6B4F;--acc2:#2E8B68;--accSoft:#E3EEE7;--amber:#A66A1F;--amberSoft:#F5EAD5;--red:#B23B2E;--redSoft:#F6E2DE;
--shadow:0 1px 2px rgba(32,40,31,.05),0 10px 26px -14px rgba(32,40,31,.22);--r:14px;--font:'Sora',ui-sans-serif,system-ui,sans-serif}
[data-theme=dark]{--bg:#141812;--panel:#1B211A;--panel2:#171D16;--ink:#EAE6D8;--ink2:#A9B09B;--mut:#7C8471;--line:#2A3226;--line2:#232A1F;
--acc:#5FBB93;--acc2:#7CCAA8;--accSoft:#1F332A;--amber:#D9A05B;--amberSoft:#33291A;--red:#E0796C;--redSoft:#3A2320;
--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.5)}
html{font-size:15px}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
h1,h2,h3{letter-spacing:-.015em}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.sm{font-size:.78rem}
.lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-weight:600}
#boot{min-height:100vh;display:grid;place-items:center;padding:20px}
.center{max-width:420px;width:100%}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo svg{width:44px;height:44px;border-radius:11px}
.logo h1{font-size:1.25rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.field{margin-bottom:12px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink);font:inherit;font-size:.92rem}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--acc2);outline-offset:-1px}
.field textarea{min-height:90px;resize:vertical;font-size:.84rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;transition:filter .12s}
.btn:hover{filter:brightness(.97)}
.btn-p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn-s{background:transparent;border-color:transparent;color:var(--ink2)}
.btn-d{background:transparent;color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:.76rem;font-weight:600;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--accSoft);border-color:var(--acc2);color:var(--acc)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.badge.ok{background:var(--accSoft);color:var(--acc)}
.badge.due{background:var(--amberSoft);color:var(--amber)}
.badge.adv{background:var(--accSoft);color:var(--acc)}
.badge.off{background:var(--redSoft);color:var(--red)}
.badge.active,.badge.left{background:var(--accSoft);color:var(--acc)}
.badge.inactive{background:var(--redSoft);color:var(--red)}
#app{display:flex;min-height:100vh}
#side{width:246px;position:fixed;inset:0 auto 0 0;border-right:1px solid var(--line);background:var(--panel);padding:18px 14px;display:flex;flex-direction:column;gap:2px;z-index:30;overflow-y:auto}
#side .logo{padding:6px 10px 16px}
.snav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--ink2);text-decoration:none;font-size:.88rem;font-weight:600}
.snav svg{width:18px;height:18px}
.snav.on{background:var(--accSoft);color:var(--acc)}
.snav:hover{background:var(--panel2)}
.sgroup{margin:14px 8px 6px}
#mainwrap{flex:1;margin-left:246px;display:flex;flex-direction:column;min-height:100vh}
#topbar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 22px;z-index:20}
#topbar h2{font-size:1.02rem;margin-right:auto}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink2);cursor:pointer}
.iconbtn svg{width:17px;height:17px}
#dot{width:9px;height:9px;border-radius:50%;background:var(--acc)}
#dot.off{background:var(--red)}
#qbadge{display:none;background:var(--amber);color:#fff;border-radius:999px;font-size:.6rem;padding:1px 6px;font-weight:700}
#view{padding:22px;max-width:1080px;width:100%;margin:0 auto;padding-bottom:100px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.page-head h3{font-size:1.05rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
.stat{padding:14px 16px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.stat .v{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:5px}
.stat .v.small{font-size:1rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.sec{margin-top:18px}
.sec>h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin-bottom:8px}
.today{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);overflow:hidden;margin-top:14px;flex-wrap:wrap}
.today .tdate{padding:16px 18px;border-right:1px solid var(--line2);min-width:118px}
.today .tdate b{font-size:1.6rem;font-variant-numeric:tabular-nums}
.today .tset{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr))}
.tcell{padding:14px 10px;border-right:1px solid var(--line2);text-align:center}
.tcell b{display:block;font-size:1.45rem;font-variant-numeric:tabular-nums}
.tcell.t b{color:var(--acc)}
.tside{padding:14px 18px;display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line2);min-width:130px}
.tblwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.83rem}
.tbl th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.rowline{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.rowline:hover{background:var(--panel2)}
.rowline:last-child{border-bottom:0}
.rowline .grow{flex:1;min-width:0}
.daystrip{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px}
.dchip{min-width:64px;text-align:center;padding:7px 9px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;flex-shrink:0}
.dchip b{display:block;font-size:1.02rem;font-variant-numeric:tabular-nums}
.dchip.on{background:var(--accSoft);border-color:var(--acc2)}
.dchip .tod{color:var(--acc);font-weight:700}
.mrow{display:grid;grid-template-columns:minmax(130px,1fr) repeat(var(--mt,3),86px) 46px 58px;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line2)}
.mrow.absent{opacity:.45}
.mrow .who b{font-size:.88rem;display:block}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel2)}
.step button{width:32px;height:32px;background:none;border:0;color:var(--ink2);cursor:pointer;font-size:1.1rem;line-height:1}
.step .n{min-width:24px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:.9rem}
.step .n.hot{color:var(--acc)}
.rtot{text-align:center;font-weight:700}
.tog{width:44px;padding:5px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);font-size:.66rem;font-weight:700;color:var(--mut);cursor:pointer}
.tog.on{background:var(--amberSoft);color:var(--amber);border-color:var(--amber)}
.mtotals{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin:8px 0 12px}
.mtotals .tt{padding:6px 13px;border-radius:10px;background:var(--panel2);font-weight:700;font-variant-numeric:tabular-nums;font-size:.92rem}
.mtotals .tt.t{background:var(--accSoft);color:var(--acc)}
.savebar{position:fixed;bottom:78px;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:35}
@media(min-width:861px){.savebar{bottom:22px}}
.savebar .btn{pointer-events:auto;box-shadow:0 10px 30px -8px rgba(0,0,0,.4)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{padding:9px 14px;font-size:.84rem;font-weight:600;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.mwrap{position:fixed;inset:0;z-index:60;display:grid;place-items:end center}
@media(min-width:700px){.mwrap{place-items:center}}
.mback{position:absolute;inset:0;background:rgba(15,20,14,.55)}
.modal{position:relative;width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:var(--shadow)}
@media(min-width:700px){.modal{border-radius:16px}}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--panel)}
.mbody{padding:18px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line2);position:sticky;bottom:0;background:var(--panel)}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;width:min(92vw,380px)}
.toast{background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:11px;font-size:.83rem;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.toast.err{background:var(--red);color:#fff}
.toast button{background:none;border:0;color:inherit;font:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
#ob{position:fixed;top:0;left:0;right:0;z-index:70;background:var(--amber);color:#fff;text-align:center;font-size:.78rem;font-weight:600;padding:6px}
#bnav{display:none}
#bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;font-size:.6rem;font-weight:600;color:var(--ink2);text-decoration:none}
#bnav a svg{width:20px;height:20px}
#bnav a.on{color:var(--acc)}
.fab{position:fixed;right:18px;bottom:92px;width:54px;height:54px;border-radius:16px;background:var(--acc);color:#fff;border:0;box-shadow:0 12px 28px -8px rgba(31,107,79,.55);cursor:pointer;display:grid;place-items:center;z-index:35}
.fab svg{width:22px;height:22px}
.leg{display:flex;flex-direction:column;gap:5px;font-size:.78rem}
.leg .li{display:flex;align-items:center;gap:8px}
.leg .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.itemrows .irow{display:grid;grid-template-columns:1fr 74px 58px 84px 34px;gap:7px;margin-bottom:8px;align-items:center}
.itemrows input,.itemrows select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--ink);font:inherit;font-size:.85rem}
.chartcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.chartcard h5{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin-bottom:10px}
.alert{display:flex;gap:9px;align-items:center;padding:10px 13px;border:1px solid var(--amber);background:var(--amberSoft);color:var(--amber);border-radius:10px;font-size:.8rem;font-weight:600;margin-top:10px}
.alert svg{width:16px;height:16px;flex-shrink:0}
.loader{display:flex;justify-content:center;padding:50px}
.loader i{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.errbox{padding:30px;text-align:center;color:var(--red);font-weight:600}
.wizdots{display:flex;gap:6px;margin:12px 0 18px}
.wizdots i{width:26px;height:5px;border-radius:3px;background:var(--line)}
.wizdots i.on{background:var(--acc)}
.fline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:.87rem}
.sw{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex-shrink:0;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--panel);transition:left .15s}
.sw.on{background:var(--acc)}
.sw.on::after{left:21px}
#usermenu{position:absolute;top:52px;right:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:200px;padding:6px;z-index:50;display:none}
#usermenu a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;text-decoration:none;font-size:.85rem;font-weight:600;color:var(--ink2);cursor:pointer}
#usermenu a:hover{background:var(--panel2)}
#usermenu a svg{width:16px;height:16px}
@media(max-width:860px){
#side{display:none}#mainwrap{margin-left:0}
#bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);z-index:40;padding:5px 6px calc(5px + env(safe-area-inset-bottom))}
#view{padding:14px 14px 92px}
.stats{grid-template-columns:repeat(2,1fr)}
.grid2{grid-template-columns:1fr}
.mrow{grid-template-columns:minmax(104px,1fr) repeat(var(--mt,3),72px) 40px 52px;gap:5px;padding:8px 6px}
.fline{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="boot"><div class="loader"><i></i></div></div>
<div id="app" hidden>
  <div id="ob" hidden>Offline — read only. Queued changes will sync when you are back online.</div>
  <aside id="side"></aside>
  <div id="mainwrap">
    <header id="topbar">
      <h2 id="pgtitle">Dashboard</h2>
      <span id="qbadge"></span><span id="dot"></span>
      <button class="iconbtn" id="btnSearch" title="Search"></button>
      <button class="iconbtn" id="btnTheme" title="Theme"></button>
      <div style="position:relative">
        <button class="iconbtn" id="btnUser" title="Account"></button>
        <div id="usermenu"></div>
      </div>
    </header>
    <main id="view"></main>
  </div>
  <nav id="bnav"></nav>
</div>
<div id="modals"></div>
<div id="toasts"></div>

const addDays=(d,n)=>{const p=d.split('-');const dt=new Date(+p[0],+p[1]-1,+p[2]+n);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')};

download:'M12 3v12M7 10l5 5 5-5M4 21h16',

trash:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',

let CACHE_MEMBERS=null;
const CACHEABLE=['dashboard.get','members.list','meals.get','bazar.list','expenses.list','payments.list','accounting.summary','accounting.preview','notifications.list','audit.list','users.list','members.statement','members.get','settings.get'];
const QUEUEABLE=['meals.save','payments.create','bazar.create','expenses.create'];
const apiKeyOf=(a,p)=>a+'|'+JSON.stringify(p||{});
function cachePut(a,p,d){ if(CACHEABLE.includes(a)){try{localStorage.setItem(LS.cache+apiKeyOf(a,p),JSON.stringify({t:Date.now(),d:d}))}catch(e){}} }
function cacheGet(a,p){ try{const j=localStorage.getItem(LS.cache+apiKeyOf(a,p)); return j?JSON.parse(j).d:null}catch(e){return null} }
function getQueue(){ try{return JSON.parse(localStorage.getItem(LS.queue)||'[]')}catch(e){return[]} }
function setQueue(q){ localStorage.setItem(LS.queue,JSON.stringify(q)); updateSyncBadge(); }
function queueAdd(a,p){ p.clientId=p.clientId||uuid(); const q=getQueue(); q.push({action:a,payload:p,ts:Date.now()}); setQueue(q); }
function updateSyncBadge(){ const n=getQueue().length; const b=$('#qbadge'); if(b){b.style.display=n?'inline-block':'none';b.textContent=n+' pending';} }
async function api(action,payload={}){
  if(!S.api) throw ApiErr('NO_API','App URL is not set');
  let res;
  try{ res=await fetch(S.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:S.token,payload,meta:{agent:navigator.userAgent}})}); }
  catch(net){ if(QUEUEABLE.includes(action)){ payload.clientId=payload.clientId||uuid(); queueAdd(action,payload); throw ApiErr('OFFLINE','Saved on this device — it will sync automatically when you are online.'); }
    throw ApiErr('OFFLINE','You appear to be offline.'); }
  if(!res.ok){ if(QUEUEABLE.includes(action)){ payload.clientId=payload.clientId||uuid(); queueAdd(action,payload); throw ApiErr('OFFLINE','Saved on this device — it will sync when online.'); }
    throw ApiErr('NETWORK','Server error ('+res.status+')'); }
  const j=await res.json();
  if(!j.success){ if(j.errorCode==='AUTH'){ doLogout(false); } throw ApiErr(j.errorCode,j.message); }
  cachePut(action,payload,j.data); return j.data;
}
async function apiC(action,payload={}){
  try{ return await api(action,payload); }
  catch(e){ if(e.code==='OFFLINE'||e.code==='NETWORK'){ const c=cacheGet(action,payload); if(c) return c; } throw e; }
}
async function flushQueue(){
  const q=getQueue(); if(!q.length) return;
  const remain=[];
  for(const it of q){
    try{ await api(it.action,it.payload); toast('Synced one pending change',''); }
    catch(e){ if(e.code==='OFFLINE'||e.code==='NETWORK') remain.push(it); else toast('Could not sync a queued change: '+e.msg,'err'); }
  }
  setQueue(remain);
}

  const upd=()=>{ S.online=navigator.onLine; $('#ob').hidden=S.online; $('#dot').className=S.online?'':'off'; if(S.online) flushQueue(); };

}

/* ================= charts ================= */
const PALETTE=['#2E8B68','#C98A2D','#B2543B','#7A9B57','#5E8B7A','#8B6E4E','#A38A6E','#4E6E5E'];
function barChart(items,h2){
  const w=560,hh=h2||140,max=Math.max(1,...items.map(i=>i.value));
  const bw=Math.max(3,(w/items.length)*0.6);
  let bars='',labels='';
  items.forEach((it,i)=>{
    const cx=(i+0.5)*w/items.length, x=cx-bw/2;
    const bh=Math.max(it.value>0?3:0,(it.value/max)*(hh-24));
    bars+='<rect x="'+x.toFixed(1)+'" y="'+(hh-18-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="3" fill="var(--acc)" opacity="'+(it.value?0.85:0.15)+'"><title>'+h(it.label)+': '+h(it.display||it.value)+'</title></rect>';
    if(items.length<=8||i%2===0) labels+='<text x="'+cx+'" y="'+(hh-4)+'" text-anchor="middle" font-size="8.5" fill="var(--mut)">'+h(it.label)+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+hh+'" style="width:100%;height:auto;display:block">'+bars+'<line x1="0" y1="'+(hh-18)+'" x2="'+w+'" y2="'+(hh-18)+'" stroke="var(--line)"/>'+labels+'</svg>';
}
function donut(items,totalLabel){
  const total=items.reduce((s,i)=>s+i.value,0)||1;
  let segs='',off=0; const C=2*Math.PI*54;
  items.forEach(it=>{ const dash=(it.value/total)*C;
    segs+='<circle r="54" cx="70" cy="70" fill="none" stroke="'+it.color+'" stroke-width="17" stroke-dasharray="'+dash.toFixed(1)+' '+(C-dash).toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'" transform="rotate(-90 70 70)"><title>'+h(it.label)+': '+h(it.value)+'</title></circle>'; off+=dash; });
  return '<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 140 140" width="140" height="140">'+segs+'<text x="70" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">'+h(totalLabel)+'</text></svg>'
    +'<div class="leg">'+items.map(it=>'<div class="li"><span class="sw" style="background:'+it.color+'"></span>'+h(it.label)+' <span class="mut num">'+h(it.display||it.value)+'</span></div>').join('')+'</div></div>';
}

let ME={};
async function viewMeals(params){
  const date=params.get('date')||todayISO();
  const d=await apiC('meals.get',{date});
  ME={...d,dirty:false};
  const readOnly=ME.locked&&S.user.role!=='Admin';
  const v=$('#view');
  v.style.setProperty('--mt',ME.mealTypes.length);
  v.innerHTML='<div class="page-head"><h3>Daily meal entry</h3>'
   +'<div style="display:flex;gap:6px;flex-wrap:wrap">'
   +'<button class="btn" id="cp">'+ico('copy')+'Copy previous day</button>'
   +'<button class="btn" id="mall">'+ico('check')+'Mark all</button>'
   +'<button class="btn btn-s" id="mclr">Clear</button></div></div>'
   +'<div class="daystrip">'+[...Array(7)].map((_,i)=>{const dd=addDays(date,i-6);const isT=dd===todayISO();
      return '<div class="dchip'+(dd===date?' on':'')+'" data-d="'+dd+'"><span class="'+(isT?'tod':'')+'">'+(isT?'TODAY':dd.substring(8)+'/'+dd.substring(5,7))+'</span><b class="num">'+dd.substring(0,4)+'</b></div>';}).join('')
   +'<input type="date" id="dpick" value="'+date+'" style="border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:6px 10px"></div>'
   +(ME.locked?'<div class="alert">'+ico('alert')+'<span>This month is closed'+(readOnly?' — read only.':' — as admin you can still edit (the month will be marked stale).')+'</span></div>':'')
   +'<div class="mtotals" id="mtot"></div>'
   +'<div class="tblwrap" id="mgrid"></div>'
   +'<div class="savebar"><button class="btn btn-p" id="msave">'+ico('check')+'Save meals</button></div>';
  function renderTotals(){
    const tt={}; let tot=0;
    ME.mealTypes.forEach(t=>{tt[t]=ME.entries.reduce((s,e)=>s+(e.meals[t]||0),0); tot+=tt[t];});
    $('#mtot').innerHTML=ME.mealTypes.map(t=>'<span class="tt">'+h(t.slice(0,3).toUpperCase())+' '+tt[t]+'</span>').join('')
      +'<span class="tt t">TOTAL '+tot+'</span><span style="flex:1"></span><span class="sm mut">'+ME.entries.length+' members</span>';
  }
  function renderGrid(){
    $('#mgrid').innerHTML=ME.entries.map((e,i)=>{
      const tot=ME.mealTypes.reduce((s,t)=>s+(e.meals[t]||0),0);
      return '<div class="mrow'+(e.absent?' absent':'')+'" data-i="'+i+'">'
      +'<div class="who"><b>'+h(e.name)+'</b><span class="sm mut">'+h(e.room||'')+(e.status!=='active'?' · '+h(e.status):'')+'</span></div>'
      +ME.mealTypes.map(t=>'<div class="step"><button data-t="'+t+'" data-d="-1">'+ico('minus')+'</button><span class="n'+((e.meals[t]||0)>0?' hot':'')+'">'+(e.meals[t]||0)+'</span><button data-t="'+t+'" data-d="1">'+ico('plus')+'</button></div>').join('')
      +'<div class="rtot num">'+tot+'</div>'
      +'<button class="tog'+(e.absent?' on':'')+'" title="Mark absent">ABS</button></div>';
    }).join('')||'<p class="sm mut" style="padding:16px">No members to show for this date.</p>';
    renderTotals();
    $$('#mgrid .mrow').forEach(row=>{
      const i=+row.dataset.i;
      row.querySelectorAll('.step button').forEach(b=>b.onclick=()=>{
        if(readOnly) return toast('This month is closed','err');
        const t=b.dataset.t, dd=+b.dataset.d, e=ME.entries[i];
        e.absent=false; row.classList.remove('absent'); row.querySelector('.tog').classList.remove('on');
        e.meals[t]=Math.max(0,Math.min(20,(e.meals[t]||0)+dd));
        updateRow(row,i);
      });
      row.querySelector('.tog').onclick=()=>{
        if(readOnly) return toast('This month is closed','err');
        const e=ME.entries[i]; e.absent=!e.absent;
        if(e.absent) ME.mealTypes.forEach(t=>e.meals[t]=0);
        row.classList.toggle('absent',e.absent); updateRow(row,i);
      };
    });
  }
  function updateRow(row,i){
    const e=ME.entries[i];
    row.querySelectorAll('.step').forEach((st,j)=>{
      const t=ME.mealTypes[j], val=e.meals[t]||0;
      st.querySelector('.n').textContent=val;
      st.querySelector('.n').classList.toggle('hot',val>0);
    });
    row.querySelector('.rtot').textContent=ME.mealTypes.reduce((s,t)=>s+(e.meals[t]||0),0);
    ME.dirty=true; renderTotals();
  }
  renderGrid();
  $$('.dchip').forEach(c=>c.onclick=()=>{ if(ME.dirty&&!confirm('You have unsaved changes. Leave anyway?'))return; location.hash='#/meals?date='+c.dataset.d; });
  $('#dpick').onchange=e=>{ if(ME.dirty&&!confirm('You have unsaved changes. Leave anyway?'))return; location.hash='#/meals?date='+e.target.value; };
  $('#mall').onclick=()=>{ if(readOnly)return toast('This month is closed','err');
    ME.entries.forEach(e=>{ if(e.status==='active'){e.absent=false;ME.mealTypes.forEach(t=>e.meals[t]=1);} }); ME.dirty=true; renderGrid(); };
  $('#mclr').onclick=()=>{ if(readOnly)return toast('This month is closed','err');
    ME.entries.forEach(e=>{ME.mealTypes.forEach(t=>e.meals[t]=0);}); ME.dirty=true; renderGrid(); };
  $('#cp').onclick=async()=>{
    if(readOnly) return toast('This month is closed','err');
    if(!await confirmDlg('Copy meal entries from '+fmtD(addDays(date,-1))+' to '+fmtD(date)+'? Existing entries for '+fmtD(date)+' will be overwritten.')) return;
    try{ await api('meals.copyDay',{from:addDays(date,-1),to:date}); toast('Copied'); viewMeals(new URLSearchParams('date='+date)); }
    catch(e){ toast(e.msg,'err'); } };
  $('#msave').onclick=async()=>{
    if(readOnly) return toast('This month is closed','err');
    try{
      const r=await api('meals.save',{date:ME.date,entries:ME.entries.map(e=>({memberId:e.memberId,meals:e.meals,absent:e.absent}))});
      ME.dirty=false; toast('Meals saved — total '+r.total); viewMeals(new URLSearchParams('date='+ME.date));
    }catch(e){ toast(e.msg, e.code==='OFFLINE'?'':'err'); } };
}

async function sendWaSafe(memberId,type,extra){
  if(S.waConfigured){
    try{ await api('whatsapp.send',{type:type,memberId:memberId,...extra}); toast('Sent via WhatsApp API'); return; }
    catch(e){ if(e.code!=='WA_NOT_SET'&&e.code!=='FORBIDDEN'){ toast(e.msg,'err'); return; } }
  }
  const st=await apiC('members.statement',{memberId:memberId,month:monthOf(todayISO())}).catch(()=>null);
  const ph=((st&&st.member.mobile)||'').replace(/[^\d]/g,'');
  if(!ph) return toast('This member has no mobile number','err');
  const text=type==='bill'? billText(st) : (S.settings.MESS_NAME||'Mess')+' — payment receipt';
  open('https://wa.me/'+ph+'?text='+encodeURIComponent(text),'_blank');
}
function billText(st){
  return (S.settings.MESS_NAME||'Mess')+' — '+fmtML(st.month)+' bill\nMeals: '+st.meals+' × '+fmtM(st.mealRate)+' = '+fmtM(st.mealCost)
   +'\nOther charges: '+fmtM(r2l(st.fixed+st.share+st.other))+'\nTotal payable: '+fmtM(st.payable)+'\nPaid: '+fmtM(st.paid)
   +'\nBalance: '+(st.balance>0?'DUE '+fmtM(st.balance):st.balance<0?'ADVANCE '+fmtM(Math.abs(st.balance)):'PAID');
}

async function viewMember(params){

   +'<span class="badge '+h(m.status)+'">'+h(m.status)+'</span>'+balBadge

   +'<div class="tabs">'+[['st','Statement'],['ml','Meals'],['pay','Payments']].map(t=>'<div class="tab'+(tab===t[0]?' on':'')+'" data-t="'+t[0]+'">'+t[1]+'</div>').join('')+'</div><div id="mbody"></div>';
  function renderTab(){
    $$('#view .tab').forEach(t=>t.classList.toggle('on',t.dataset.t===tab));

      b.innerHTML='<div class="page-head" style="margin:6px 0 10px">'+monthInput('stm',month)+'<div style="display:flex;gap:6px;flex-wrap:wrap">'
      +'<button class="btn" id="spdf">'+ico('file')+'PDF</button><button class="btn" id="spr">'+ico('print')+'Print</button>'
      +'<button class="btn" id="sem">'+ico('mail')+'Email</button><button class="btn" id="swa">'+ico('chat')+'WhatsApp</button></div></div>'
      +statementBlock(st);
      $('#stm').onchange=()=>location.hash='#/member?id='+id+'&month='+$('#stm').value;
      $('#spdf').onclick=async()=>{ try{ const r=await api('reports.pdf',{type:'statement',memberId:id,month}); downloadPdf(r.base64,r.filename); }catch(e){ toast(e.msg,'err'); }};
      $('#spr').onclick=()=>printHtml('Statement '+m.name, printableStatement(st));
      $('#sem').onclick=async()=>{ try{ await api('email.send',{type:'bill',memberId:id,month}); toast('Statement emailed'); }catch(e){ toast(e.msg,'err'); }};
      $('#swa').onclick=()=>sendWaSafe(id,'bill',{month:month});
    }
    if(tab==='ml'){
      b.innerHTML='<div class="page-head" style="margin:6px 0 10px">'+monthInput('mlm',month)+'</div>'
      +'<div class="tblwrap"><table class="tbl"><tr><th>Date</th>'+st.mealTypes.map(t=>'<th class="r">'+h(t.slice(0,3))+'</th>').join('')+'<th class="r">Total</th></tr>'

      +'<tr><td><b>Total</b></td>'+st.mealTypes.map(t=>'<td class="r"><b>'+st.days.reduce((s,x)=>s+x[t],0)+'</b></td>').join('')+'<td class="r"><b>'+st.meals+'</b></td></tr>')
      +'</table></div>';
      $('#mlm').onchange=()=>location.hash='#/member?id='+id+'&month='+$('#mlm').value;
    }
    if(tab==='pay'){
      b.innerHTML='<div class="page-head" style="margin:6px 0 10px">'+monthInput('pym',month)

    }

  $('#remail').onclick=async()=>{
    if(!await confirmDlg('Email this months statement to every member who has a bill or balance?')) return;
    let n=0; for(const x of d.members){ if(Math.abs(x.balance)>0.01||x.payable>0){ try{ await api('email.send',{type:'bill',memberId:x.memberId,month}); n++; }catch(e){} } }
    toast(n+' statement(s) emailed');

  $('#rwa').onclick=async()=>{
    if(!S.waConfigured) return toast('WhatsApp API not configured. Use the WhatsApp button on a members statement (share-link fallback) instead.');
    if(!await confirmDlg('Send the monthly bill on WhatsApp to every member?')) return;
    let n=0; for(const x of d.members){ if(x.balance>0||x.payable>0){ try{ await api('whatsapp.send',{type:'bill',memberId:x.memberId,month}); n++; }catch(e){} } }
    toast(n+' WhatsApp message(s) sent');
  };
  const rc=$('#rclose'); if(rc) rc.onclick=async()=>{

  const ro=$('#ropen'); if(ro) ro.onclick=async()=>{
    if(!await confirmDlg('Reopen '+fmtML(month)+'? Editing becomes possible again. This is recorded in the audit log.',true)) return;
    try{ const r=await api('accounting.reopen',{month}); toast(r.message); viewReports(params); }catch(e){ toast(e.msg,'err'); } };
}

   '<div class="field"><div class="lbl">Name</div><input id="un" value="'+h(u?u.name:'')+'"></div>'
   +'<div class="field"><div class="lbl">Email (this is the login)</div><input id="ue" type="email" value="'+h(u?u.email:'')+'"'+(u?' disabled':'')+'></div>'
   +'<div class="fline"><div class="field"><div class="lbl">Role</div><select id="ur">'+['Admin','Manager','Accountant','Member'].map(r=>'<option'+(u&&u.role===r?' selected':'')+'>'+r+'</option>').join('')+'</select></div>'
   +'<div class="field"><div class="lbl">Member (needed for Member role)</div><select id="um"><option value="">—</option>'+options(members,'id','name',u?u.memberId:'')+'</select></div></div>'
   +(u?'':'<div class="field"><div class="lbl">Password (min 6 characters)</div><input id="up" type="password"></div>'),
   '<button class="btn btn-p" id="ugo">Save</button>');

    if(tab==='acct') b.innerHTML='<div class="card">'
     +'<div class="field"><div class="lbl">Calculation method</div><select id="s_calc">'+Object.entries({meals_only_equal:'Meal rate = Bazar / Meals, other expenses split equally',meals_plus_fixed:'Meal rate = Bazar / Meals, other expenses from fixed charges',all_inclusive:'Meal rate = (Bazar + other expenses) / Meals'}).map(x=>'<option value="'+x[0]+'"'+(s.CALC_METHOD===x[0]?' selected':'')+'>'+x[1]+'</option>').join('')+'</select></div>'
     +G('s_fixed','Default fixed charge per member',s.DEFAULT_FIXED_CHARGE)+G('s_svc','Service charge % on meal cost',s.SERVICE_CHARGE_PCT)+G('s_close','Month closing day (1–28)',s.CLOSING_DAY)
     +G('s_types','Meal types, comma separated',s.MEAL_TYPES)
     +'<div class="fline">'+G('s_cats','Expense categories',s.CATEGORIES)+G('s_bcats','Bazar categories',s.BAZAR_CATEGORIES)+'</div>'
     +'<button class="btn btn-p" id="sv">Save</button></div>';
    if(tab==='notif') b.innerHTML='<div class="card">'
     +swtch('EMAIL_ENABLED','Email notifications (bills, receipts, reminders)',s.EMAIL_ENABLED==='true')
     +swtch('WHATSAPP_ENABLED','Use WhatsApp API (when configured)',s.WHATSAPP_ENABLED==='true')
     +'<div style="height:14px"></div><div class="lbl" style="margin-bottom:6px">Automation (time triggers)</div>'
     +swtch('AUTO_MORNING','Morning meal reminder (daily ~8:00)',s.AUTO_MORNING==='true')
     +swtch('AUTO_EVENING','Evening meal-entry reminder to managers (~21:00)',s.AUTO_EVENING==='true')
     +swtch('AUTO_DUE_REMINDER','Due balance reminder (from configured day)',s.AUTO_DUE_REMINDER==='true')
     +swtch('AUTO_MONTH_CLOSE','Auto close previous month on closing day',s.AUTO_MONTH_CLOSE==='true')
     +swtch('AUTO_BACKUP','Weekly backup to Drive (Sunday ~6:00)',s.AUTO_BACKUP==='true')
     +G('s_drday','Due reminder day of month',s.DUE_REMINDER_DAY||'25')
     +'<div class="sm mut" style="margin:8px 0">After changing automation, install triggers once from the System tab.</div>'
     +'<button class="btn btn-p" id="sv">Save</button></div>';
    if(tab==='email') b.innerHTML='<div class="card"><p class="sm mut" style="margin-bottom:10px">Placeholders: {{name}} {{month}} {{meals}} {{rate}} {{meal_cost}} {{other}} {{total}} {{paid}} {{balance}} {{amount}} {{date}} {{method}} {{mess_name}}</p>'

     +'<div class="field"><div class="lbl">Due reminder</div><textarea id="s_rem">'+h(s.TPL_REMINDER)+'</textarea></div>'
     +'<div class="field"><div class="lbl">Meal reminder</div><textarea id="s_meal">'+h(s.TPL_MEAL)+'</textarea></div>'
     +'<button class="btn btn-p" id="sv">Save</button> <button class="btn" id="stest">Send test email to me</button></div>';
    if(tab==='wa') b.innerHTML='<div class="card">'
     +'<div class="field"><div class="lbl">Provider</div><select id="w_prov"><option value="none"'+(s.WA_PROVIDER==='none'?' selected':'')+'>Disabled (share-link fallback)</option><option value="generic"'+(s.WA_PROVIDER!=='none'?' selected':'')+'>Generic JSON API</option></select></div>'
     +G('w_url','API URL',s.WA_API_URL)+G('w_sender','Sender number',s.WA_SENDER)+G('w_cc','Country code',s.WA_COUNTRY_CODE)

     +G('w_to','Test phone number','','017XXXXXXXX')

    if(tab==='backup') b.innerHTML='<div class="card"><p class="sm mut" style="margin-bottom:10px">Each backup is a full copy of the spreadsheet, stored in a Drive folder called "Mess Backups". The main database is never touched.</p>'

     +'<button class="btn btn-p" id="tri">'+ico('check')+'Install / refresh triggers</button> <button class="btn btn-d" id="trc">Remove all triggers</button>'
     +'<div style="height:18px"></div><div class="lbl" style="margin-bottom:8px">Danger zone</div>'
     +'<button class="btn btn-d" id="wipe">Delete demo data</button>'
     +'<div class="sm mut" style="margin-top:14px"><a href="#/audit" style="color:var(--acc)">Open audit log</a></div></div>';

  function bind(){
    $$('#sbody .sw').forEach(x=>x.onclick=()=>x.classList.toggle('on'));
    const val=id=>{const el=$('#'+id); return el?el.value:undefined;};
    const sv=$('#sbody #sv'); if(sv) sv.onclick=async()=>{
      const set={};
      if(tab==='mess') Object.assign(set,{MESS_NAME:val('s_name'),MESS_ADDRESS:val('s_addr'),MESS_PHONE:val('s_phone'),MESS_EMAIL:val('s_email'),CURRENCY:val('s_cur'),TIMEZONE:val('s_tz')});
      if(tab==='acct') Object.assign(set,{CALC_METHOD:val('s_calc'),DEFAULT_FIXED_CHARGE:val('s_fixed'),SERVICE_CHARGE_PCT:val('s_svc'),CLOSING_DAY:val('s_close'),MEAL_TYPES:val('s_types'),CATEGORIES:val('s_cats'),BAZAR_CATEGORIES:val('s_bcats')});
      if(tab==='notif'){ $$('#sbody .sw').forEach(x=>set[x.dataset.k]=x.classList.contains('on')?'true':'false'); set.DUE_REMINDER_DAY=val('s_drday'); }
      if(tab==='email') Object.assign(set,{TPL_SUBJECT_BILL:val('s_subj'),TPL_BILL:val('s_bill'),TPL_RECEIPT:val('s_rcpt'),TPL_REMINDER:val('s_rem'),TPL_MEAL:val('s_meal')});
      if(tab==='pwa') Object.assign(set,{APP_NAME:val('s_app'),APP_SHORT_NAME:val('s_short')});
      try{ const r=await api('settings.update',{settings:set}); S.settings={...S.settings,...r.data.settings}; S.waConfigured=!!r.data.waConfigured; persist(); toast(r.message); }
      catch(e){ toast(e.msg,'err'); }
    };
    const stest=$('#sbody #stest'); if(stest) stest.onclick=async()=>{
      try{ await api('email.send',{type:'summary',month:monthOf(todayISO())}); toast('Test email sent to your address'); }catch(e){ toast(e.msg,'err'); } };
    const svwa=$('#sbody #svwa'); if(svwa) svwa.onclick=async()=>{
      const wa={provider:$('#w_prov').value,url:$('#w_url').value,sender:$('#w_sender').value};

      try{ const r=await api('settings.update',{settings:{WA_COUNTRY_CODE:$('#w_cc').value},wa:wa});

      catch(e){ toast(e.msg,'err'); } };

    const inst=$('#sbody #inst'); if(inst) inst.onclick=promptInstall;
    const bk=$('#sbody #bk'); if(bk) bk.onclick=async()=>{ try{ const r=await api('backup.run'); toast(r.message); loadBackups(); }catch(e){ toast(e.msg,'err'); } };
    const tri=$('#sbody #tri'); if(tri) tri.onclick=async()=>{ try{ const r=await api('triggers.setup'); toast(r.message); loadTriggers(); }catch(e){ toast(e.msg,'err'); } };
    const trc=$('#sbody #trc'); if(trc) trc.onclick=async()=>{ if(!await confirmDlg('Remove all automation triggers?',true))return;
      try{ const r=await api('triggers.clear'); toast(r.message); loadTriggers(); }catch(e){ toast(e.msg,'err'); } };
    const wipe=$('#sbody #wipe'); if(wipe) wipe.onclick=async()=>{
      if(!await confirmDlg('Delete all records that came from the demo data loader? Real records are untouched.',true)) return;
      try{ const r=await api('setup.wipeDemo'); toast(r.message); }catch(e){ toast(e.msg,'err'); } };
    if(tab==='backup') loadBackups();
    if(tab==='system') loadTriggers();
  }
  async function loadBackups(){ try{ const d=await apiC('backup.list');
    $('#bklist').innerHTML=d.backups.map(b=>'<div class="rowline"><div class="grow"><b class="sm">'+h(b.name)+'</b><div class="sm mut">'+h(b.date)+'</div></div><a class="btn btn-s" target="_blank" href="'+h(b.url)+'">Open</a></div>').join('')||'<p class="sm mut">No backups yet.</p>'; }catch(e){} }
  async function loadTriggers(){ try{ const d=await apiC('triggers.status');
    $('#trig').innerHTML=d.triggers.length? d.triggers.map(t=>h(t.handler)+' ('+h(t.type)+')').join('<br>') : 'No triggers installed. Automation stays off until you install them.'; }catch(e){ $('#trig').textContent='Could not load trigger status.'; } }
  render();
  $$('#view .tab').forEach(t=>t.onclick=()=>{tab=t.dataset.t;render();});
}

  $('#view').innerHTML='<div class="page-head"><h3>More</h3><span class="sm mut">'+h(S.user.name)+' · '+h(role)+'</span></div>'
   +'<div class="tblwrap">'+items.map(x=>'<div class="rowline" data-go="'+x.id+'">'+ico(x.i)+'<div class="grow"><b>'+x.t+'</b></div>'+ico('chevR')+'</div>').join('')
   +'<div class="rowline" id="moTheme">'+ico(localStorage.getItem(LS.theme)==='dark'?'sun':'moon')+'<div class="grow"><b>Toggle light / dark</b></div></div>'
   +'<div class="rowline" id="moInstall">'+ico('download')+'<div class="grow"><b>Install app</b></div></div>'
   +'<div class="rowline" id="moSync">'+ico('refresh')+'<div class="grow"><b>Sync pending changes</b><div class="sm mut">'+getQueue().length+' queued</div></div></div>'
   +'<div class="rowline" id="moOut" style="color:var(--red)">'+ico('logout')+'<div class="grow"><b>Sign out</b></div></div></div>';
  $$('#view [data-go]').forEach(r=>r.onclick=()=>location.hash='#/'+r.dataset.go);
  $('#moTheme').onclick=()=>{toggleTheme();viewMore();};
  $('#moInstall').onclick=promptInstall;
  $('#moSync').onclick=async()=>{ await flushQueue(); toast(getQueue().length?'Still pending: '+getQueue().length:'Everything is synced'); viewMore(); };
  $('#moOut').onclick=()=>doLogout(true);
}
/* ---------- Search ---------- */
async function viewSearch(params){
  const q=params.get('q')||'';
  $('#view').innerHTML='<div class="page-head"><h3>Search</h3></div>'
   +'<div class="field"><input id="sq" placeholder="Member, mobile, ID, item, expense, payment, reference…" value="'+h(q)+'"></div><div id="sres"></div>';
  $('#sq').focus();
  let tmr; $('#sq').oninput=e=>{clearTimeout(tmr);tmr=setTimeout(()=>{history.replaceState(null,'','#/search?q='+encodeURIComponent(e.target.value));doSearch(e.target.value);},400);};
  if(q) doSearch(q);
  async function doSearch(qq){
    if(qq.trim().length<2){ $('#sres').innerHTML=''; return; }
    let d; try{ d=await apiC('search.query',{q:qq}); }catch(e){ $('#sres').innerHTML='<p class="sm mut" style="padding:12px">'+h(e.msg)+'</p>'; return; }
    $('#sres').innerHTML=d.groups.map(g=>'<div class="sec"><h4>'+h(g.label)+'</h4><div class="tblwrap">'
      +g.items.map(it=>'<div class="rowline" data-mod="'+h(g.module)+'" data-id="'+h(it.id)+'"><div class="grow"><b>'+h(it.title)+'</b><div class="sm mut">'+h(it.sub)+'</div></div>'+ico('chevR')+'</div>').join('')
      +'</div></div>').join('')||'<p class="sm mut" style="padding:14px">No results.</p>';
    $$('#sres .rowline').forEach(r=>r.onclick=()=>{
      if(r.dataset.mod==='member') location.hash='#/member?id='+r.dataset.id;
      else if(r.dataset.mod==='payment') location.hash='#/payments';
      else if(r.dataset.mod==='bazar') location.hash='#/bazar';
      else location.hash='#/expenses';
    });
  }
}
/* ---------- PWA ---------- */
function registerSW(){
  if(!('serviceWorker' in navigator)||!location.protocol.startsWith('http')) return;
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{ const nw=reg.installing; if(!nw)return;
      nw.addEventListener('statechange',()=>{ if(nw.state==='installed'&&navigator.serviceWorker.controller){
        toast('A new version is ready','',{label:'Update',cb:()=>nw.postMessage({type:'SKIP_WAITING'})}); } }); });
  }).catch(()=>{});
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!refreshing){refreshing=true;location.reload();} });
}
function promptInstall(){
  if(S.installEvt){ S.installEvt.prompt(); S.installEvt=null; }
  else toast('To install: open your browser menu and choose "Install app" / "Add to Home screen".');
}
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); S.installEvt=e; });
addEventListener('appinstalled',()=>toast('App installed'));
/* ---------- go ---------- */
init();
</script>
